<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="sky-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="60%" stop-color="#0f111a"/>
      <stop offset="100%" stop-color="#1a1118"/>
    </linearGradient>

    <!-- Crimson Sun Glow -->
    <radialGradient id="sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#991b1b" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>

    <!-- Headlight Beam Gradient -->
    <linearGradient id="headlight-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="20%" stop-color="#fef08a" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#fef08a" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0"/>
    </linearGradient>

    <!-- Taillight Trail Gradient -->
    <linearGradient id="taillight-trail" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#dc2626" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#991b1b" stop-opacity="0"/>
    </linearGradient>

    <!-- Car Body Paint Gradient -->
    <linearGradient id="car-paint" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="40%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="windshield-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#0f172a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Tarmac Road Gradient -->
    <linearGradient id="road-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14151b"/>
      <stop offset="25%" stop-color="#1c1d25"/>
      <stop offset="100%" stop-color="#0f1015"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      /* Road stripes motion */
      @keyframes moveRoad {
        0% { transform: translateX(0); }
        100% { transform: translateX(-160px); }
      }
      .animated-road {
        animation: moveRoad 0.45s linear infinite;
      }

      /* Distant city parallax */
      @keyframes moveCity {
        0% { transform: translateX(0); }
        100% { transform: translateX(-300px); }
      }
      .animated-city {
        animation: moveCity 14s linear infinite;
      }

      /* Suspension bounce */
      @keyframes suspension {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }
      .car-group {
        animation: suspension 0.28s ease-in-out infinite;
      }

      /* Wheel spin */
      @keyframes spinRim {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .spinning-wheel {
        transform-box: fill-box;
        transform-origin: center;
        animation: spinRim 0.22s linear infinite;
      }

      /* Taillight pulse and trailing speed streak */
      @keyframes trailPulse {
        0%, 100% { opacity: 0.8; transform: scaleX(1); }
        50% { opacity: 1; transform: scaleX(1.2); }
      }
      .speed-trail {
        transform-box: fill-box;
        transform-origin: right center;
        animation: trailPulse 0.35s ease-in-out infinite;
      }

      /* Speed lines */
      @keyframes speedDash {
        0% { transform: translateX(400px); opacity: 0; }
        30% { opacity: 0.8; }
        80% { opacity: 0.6; }
        100% { transform: translateX(-600px); opacity: 0; }
      }
      .speed-line-1 { animation: speedDash 0.7s linear infinite; }
      .speed-line-2 { animation: speedDash 0.9s linear 0.3s infinite; }
      .speed-line-3 { animation: speedDash 0.6s linear 0.15s infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="240" rx="14" fill="url(#sky-gradient)"/>
  <rect width="998" height="238" x="1" y="1" rx="13" fill="none" stroke="#27272a" stroke-width="1.5"/>

  <!-- Distant Glowing Cyber Sun / Moon -->
  <circle cx="720" cy="95" r="75" fill="url(#sun-glow)"/>
  <circle cx="720" cy="95" r="42" fill="#ef4444" opacity="0.35"/>
  <circle cx="720" cy="95" r="28" fill="#f87171" opacity="0.5"/>

  <!-- Distant City Skyline (Silhouettes with parallax animation) -->
  <g class="animated-city" opacity="0.4">
    <!-- City Block 1 -->
    <rect x="0" y="80" width="35" height="70" fill="#181824"/>
    <rect x="40" y="55" width="28" height="95" fill="#1c1d2b"/>
    <rect x="72" y="90" width="45" height="60" fill="#151620"/>
    <rect x="122" y="65" width="32" height="85" fill="#1c1d2b"/>
    <rect x="158" y="45" width="25" height="105" fill="#222338"/>
    <polygon points="170,30 158,45 183,45" fill="#ef4444" opacity="0.6"/>
    <rect x="188" y="75" width="40" height="75" fill="#181824"/>
    <rect x="232" y="58" width="36" height="92" fill="#1f2030"/>
    <rect x="272" y="85" width="28" height="65" fill="#151620"/>
    <rect x="305" y="60" width="45" height="90" fill="#222338"/>
    <rect x="355" y="70" width="30" height="80" fill="#181824"/>
    <rect x="390" y="50" width="26" height="100" fill="#1c1d2b"/>
    <rect x="420" y="80" width="42" height="70" fill="#151620"/>
    <rect x="466" y="65" width="35" height="85" fill="#1f2030"/>
    <rect x="505" y="40" width="30" height="110" fill="#222338"/>
    <polygon points="520,25 505,40 535,40" fill="#ef4444" opacity="0.6"/>
    <rect x="540" y="75" width="45" height="75" fill="#181824"/>
    <rect x="590" y="55" width="32" height="95" fill="#1c1d2b"/>
    <rect x="626" y="82" width="40" height="68" fill="#151620"/>
    <rect x="670" y="60" width="38" height="90" fill="#1f2030"/>
    <rect x="712" y="70" width="28" height="80" fill="#181824"/>
    <rect x="744" y="48" width="34" height="102" fill="#222338"/>
    <rect x="782" y="85" width="45" height="65" fill="#151620"/>
    <rect x="831" y="65" width="30" height="85" fill="#1c1d2b"/>
    <rect x="865" y="52" width="25" height="98" fill="#222338"/>
    <rect x="894" y="75" width="42" height="75" fill="#181824"/>
    <rect x="940" y="60" width="35" height="90" fill="#1f2030"/>
    <rect x="980" y="78" width="50" height="72" fill="#151620"/>
    <!-- Wrap-around Duplicate for infinite smooth scroll -->
    <rect x="1035" y="80" width="35" height="70" fill="#181824"/>
    <rect x="1075" y="55" width="28" height="95" fill="#1c1d2b"/>
    <rect x="1107" y="90" width="45" height="60" fill="#151620"/>
    <rect x="1157" y="65" width="32" height="85" fill="#1c1d2b"/>
    <rect x="1193" y="45" width="25" height="105" fill="#222338"/>
    <polygon points="1205,30 1193,45 1218,45" fill="#ef4444" opacity="0.6"/>
    <rect x="1223" y="75" width="40" height="75" fill="#181824"/>
    <rect x="1267" y="58" width="36" height="92" fill="#1f2030"/>
    <rect x="1307" y="85" width="28" height="65" fill="#151620"/>
  </g>

  <!-- Highway Road Base -->
  <rect x="0" y="150" width="1000" height="90" fill="url(#road-gradient)"/>
  <!-- Road Horizon Line & Upper Guardrail -->
  <line x1="0" y1="150" x2="1000" y2="150" stroke="#ef4444" stroke-width="2" opacity="0.6" filter="url(#neon-glow)"/>
  <line x1="0" y1="153" x2="1000" y2="153" stroke="#3f3f46" stroke-width="1.5"/>

  <!-- Moving Road Dashes -->
  <g class="animated-road">
    <!-- Strip 1 -->
    <g fill="#f43f5e" opacity="0.85">
      <rect x="0" y="195" width="90" height="5" rx="2.5"/>
      <rect x="160" y="195" width="90" height="5" rx="2.5"/>
      <rect x="320" y="195" width="90" height="5" rx="2.5"/>
      <rect x="480" y="195" width="90" height="5" rx="2.5"/>
      <rect x="640" y="195" width="90" height="5" rx="2.5"/>
      <rect x="800" y="195" width="90" height="5" rx="2.5"/>
      <rect x="960" y="195" width="90" height="5" rx="2.5"/>
      <rect x="1120" y="195" width="90" height="5" rx="2.5"/>
    </g>
  </g>

  <!-- Lower Road Border Line -->
  <line x1="0" y1="236" x2="1000" y2="236" stroke="#27272a" stroke-width="2"/>

  <!-- Speed Dust / Neon Lines -->
  <line x1="200" y1="175" x2="280" y2="175" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" class="speed-line-1" opacity="0.7"/>
  <line x1="120" y1="188" x2="220" y2="188" stroke="#f87171" stroke-width="2" stroke-linecap="round" class="speed-line-2" opacity="0.6"/>
  <line x1="260" y1="205" x2="330" y2="205" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" class="speed-line-3" opacity="0.5"/>

  <!-- HEADLIGHT BEAM (Casting from front of car onto the highway) -->
  <polygon points="575,178 960,158 980,225 575,188" fill="url(#headlight-beam)"/>

  <!-- CAR SHADOW -->
  <ellipse cx="445" cy="198" rx="145" ry="11" fill="#000000" opacity="0.7"/>

  <!-- TAILLIGHT TRAILS (Laser streaks shooting backwards) -->
  <g class="speed-trail">
    <rect x="110" y="169" width="215" height="3.5" rx="1.75" fill="url(#taillight-trail)"/>
    <rect x="160" y="174" width="165" height="2" rx="1" fill="url(#taillight-trail)" opacity="0.8"/>
    <circle cx="325" cy="171" r="5" fill="#ef4444" filter="url(#neon-glow)"/>
  </g>

  <!-- THE SPORTS CAR (Animated with suspension bounce) -->
  <g class="car-group" transform="translate(10, 0)">
    <!-- Aerodynamic Rear Wing / Spoiler -->
    <path d="M 315 152 L 340 152 L 336 160 L 315 160 Z" fill="#18181b"/>
    <rect x="322" y="160" width="5" height="12" fill="#09090b"/>
    <path d="M 310 150 C 330 148, 350 148, 358 151 L 355 154 C 345 152, 325 152, 310 153 Z" fill="#ef4444"/>

    <!-- Main Chassis / Car Body -->
    <!-- Lower Body -->
    <path d="M 320 178 
             C 322 172, 330 168, 345 167 
             L 375 167 
             C 382 158, 395 153, 415 153 
             C 435 153, 448 158, 455 167 
             L 525 167 
             C 532 158, 545 153, 565 153 
             C 585 153, 598 158, 605 167 
             L 625 169 
             C 635 171, 642 176, 642 181
             L 638 184
             C 630 186, 615 186, 610 184
             L 330 184
             C 322 184, 318 181, 320 178 Z" 
          fill="url(#car-paint)"/>

    <!-- Cabin / Roof & Windows -->
    <path d="M 380 167 
             L 420 142 
             C 435 137, 495 137, 515 142 
             L 555 167 Z" 
          fill="#09090b" stroke="#27272a" stroke-width="1"/>

    <!-- Windshield & Side Windows Glass -->
    <path d="M 425 144 
             L 458 144 
             L 458 165 
             L 395 165 Z" 
          fill="url(#windshield-glass)"/>
    <path d="M 465 144 
             L 508 144 
             L 542 165 
             L 465 165 Z" 
          fill="url(#windshield-glass)"/>

    <!-- Pillar separator -->
    <line x1="461" y1="144" x2="461" y2="165" stroke="#18181b" stroke-width="3"/>

    <!-- Car Door Seam & Aero Side Scoops -->
    <path d="M 460 166 L 456 182" stroke="#7f1d1d" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 480 172 C 495 174, 510 174, 520 172" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Front Bumper Splitter & Headlight Lens -->
    <polygon points="636,177 641,180 635,182 626,181" fill="#fef08a" filter="url(#neon-glow)"/>
    <line x1="628" y1="184" x2="642" y2="184" stroke="#09090b" stroke-width="3"/>

    <!-- Rear Taillight Red Neon Bar -->
    <rect x="321" y="170" width="6" height="5" rx="1.5" fill="#ffffff"/>
    <rect x="319" y="169" width="10" height="7" rx="2" fill="#ef4444" opacity="0.8" filter="url(#neon-glow)"/>

    <!-- REAR WHEEL (Center: 415, 183) -->
    <g transform="translate(415, 183)">
      <!-- Tire Rubber -->
      <circle cx="0" cy="0" r="18" fill="#18181b" stroke="#09090b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="12" fill="#27272a"/>
      <!-- Brake Rotor & Crimson Caliper -->
      <circle cx="0" cy="0" r="9" fill="#52525b"/>
      <path d="M -7 -4 A 8 8 0 0 1 -2 -8 L -4 -4 Z" fill="#ef4444"/>
      <!-- Spinning Alloy Rim Spokes -->
      <g class="spinning-wheel">
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#f4f4f5" stroke-width="1.8"/>
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#f4f4f5" stroke-width="1.8"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#f4f4f5" stroke-width="1.8"/>
        <line x1="-7" y1="7" x2="7" y2="-7" stroke="#f4f4f5" stroke-width="1.8"/>
        <circle cx="0" cy="0" r="3.5" fill="#ef4444"/>
      </g>
    </g>

    <!-- FRONT WHEEL (Center: 565, 183) -->
    <g transform="translate(565, 183)">
      <!-- Tire Rubber -->
      <circle cx="0" cy="0" r="18" fill="#18181b" stroke="#09090b" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="12" fill="#27272a"/>
      <!-- Brake Rotor & Crimson Caliper -->
      <circle cx="0" cy="0" r="9" fill="#52525b"/>
      <path d="M -7 -4 A 8 8 0 0 1 -2 -8 L -4 -4 Z" fill="#ef4444"/>
      <!-- Spinning Alloy Rim Spokes -->
      <g class="spinning-wheel">
        <line x1="-10" y1="0" x2="10" y2="0" stroke="#f4f4f5" stroke-width="1.8"/>
        <line x1="0" y1="-10" x2="0" y2="10" stroke="#f4f4f5" stroke-width="1.8"/>
        <line x1="-7" y1="-7" x2="7" y2="7" stroke="#f4f4f5" stroke-width="1.8"/>
        <line x1="-7" y1="7" x2="7" y2="-7" stroke="#f4f4f5" stroke-width="1.8"/>
        <circle cx="0" cy="0" r="3.5" fill="#ef4444"/>
      </g>
    </g>
  </g>

  <!-- Overlay Top Tagline / Header Info -->
  <g transform="translate(50, 42)">
    <text x="0" y="0" font-family="'Courier New', Consolas, monospace" font-size="11" font-weight="700" fill="#ef4444" letter-spacing="3">
      CONTINUOUS VELOCITY // CONSTANT COMMITMENT
    </text>
    <text x="0" y="16" font-family="'Segoe UI', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#a1a1aa" letter-spacing="1">
      Driven by Curiosity • Building Every Single Day
    </text>
  </g>
</svg>
