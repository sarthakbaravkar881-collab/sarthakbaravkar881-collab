<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%">
  <defs>
    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f13"/>
      <stop offset="100%" stop-color="#14151b"/>
    </linearGradient>

    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3f3f46" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Quote Container Card -->
  <rect x="2" y="2" width="796" height="126" rx="12" fill="url(#quote-bg)" stroke="url(#quote-border)" stroke-width="1.5"/>

  <!-- Quotation Mark -->
  <text x="35" y="65" font-family="'Georgia', serif" font-size="70" fill="#ef4444" opacity="0.3">“</text>

  <!-- Quote Text -->
  <text x="75" y="55" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-style="italic" font-weight="500" font-size="18.5" fill="#f3f4f6">
    "I love building efficient backend systems and elegant data solutions!"
  </text>

  <!-- Attribution Signature -->
  <text x="740" y="98" text-anchor="end" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-weight="700" font-size="13" fill="#ef4444" letter-spacing="1.5">
    — SARTHAK BARAVKAR
  </text>
  <line x1="560" y1="94" x2="600" y2="94" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
</svg>
